<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>登录页 · A 精修居中版</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#ffffff}
:root{--bg:#ffffff;--fg:#0f172a;--muted:#f1f5f9;--muted-fg:#64748b;--border:#e2e8f0;--sidebar:#fafafa;--primary-soft:#eef2ff;--primary-fg:#ffffff;--amber:#b45309;--amber-soft:#fef3c7;--green:#15803d;--green-soft:#dcfce7;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
a{color:var(--primary);text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
.field{height:40px;width:100%;padding:0 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);font-size:14px;outline:none}
.field:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 20%,transparent)}
.btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;width:100%;border-radius:8px;background:var(--primary);color:var(--primary-fg);font-size:14px;font-weight:500}
.btn-primary:hover{filter:brightness(.95)}
.btn-outline{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;width:100%;border:1px solid var(--border);border-radius:8px;background:var(--bg);font-size:14px;font-weight:500;color:var(--fg)}
.btn-outline:hover{background:var(--muted)}
.link{color:var(--primary);font-size:13px}
.link:hover{text-decoration:underline}
.iconbtn:hover{background:var(--muted);color:var(--fg)}
.tile:hover{background:var(--muted)}
.row:hover{background:#f8fafc}
.chipbtn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:500}
</style>
</helmet>
<div style="width:100%;min-height:820px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:var(--bg);color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:13px;line-height:1.4;--primary:#4f46e5;padding:24px">
  <!-- depth: faint dot grid fading out + one soft glow in the primary hue -->
  <div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none">
    <div style="position:absolute;inset:0;opacity:.35;background-image:radial-gradient(var(--border) 1px,transparent 1px);background-size:22px 22px;-webkit-mask-image:radial-gradient(ellipse at center,black,transparent 72%);mask-image:radial-gradient(ellipse at center,black,transparent 72%)"></div>
    <div style="position:absolute;left:50%;top:50%;width:544px;height:544px;transform:translate(-50%,-50%);border-radius:50%;background:color-mix(in srgb,var(--primary) 10%,transparent);filter:blur(64px)"></div>
  </div>

  <div style="position:relative;width:400px;display:flex;flex-direction:column;gap:20px">
    <!-- brand mark: the tile takes the same primary token the buttons use -->
    <div style="display:flex;align-items:center;justify-content:center;gap:10px;user-select:none">
      <span style="display:inline-flex;width:36px;height:36px;align-items:center;justify-content:center;border-radius:10px;background:var(--primary);color:#fff;box-shadow:0 1px 2px color-mix(in srgb,var(--primary) 30%,transparent)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg></span>
      <span style="font-size:18px;font-weight:600;letter-spacing:-.01em">ObjectOS</span>
    </div>

    <div style="background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:28px 28px 20px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px -12px rgba(15,23,42,.12)">
      <h1 style="margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em">欢迎回来</h1>
      <p style="margin:4px 0 20px;font-size:13px;color:var(--muted-fg)">登录后继续你的工作</p>

      <!-- SSO: only when the server configures a provider; one button per provider -->
      <button type="button" class="btn-outline"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--muted-fg)"><path d="m15.5 7.5 2.3 2.3a1 1 0 0 0 1.4 0l2.1-2.1a1 1 0 0 0 0-1.4L19 4"/><path d="m21 2-9.6 9.6"/><circle cx="7.5" cy="15.5" r="5.5"/></svg>使用企业单点登录</button>
      <div style="display:flex;align-items:center;gap:12px;margin:16px 0;color:var(--muted-fg);font-size:12px"><span style="flex:1;height:1px;background:var(--border)"></span>或使用邮箱<span style="flex:1;height:1px;background:var(--border)"></span></div>

      <label for="email" style="display:block;font-size:13px;font-weight:500;margin-bottom:6px">邮箱</label>
      <input id="email" class="field" type="email" placeholder="name@company.com" style="margin-bottom:14px">
      <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px">
        <label for="pw" style="font-size:13px;font-weight:500">密码</label>
        <a href="#" class="link" style="font-size:12px">忘记密码？</a>
      </div>
      <div style="position:relative;margin-bottom:18px">
        <input id="pw" class="field" type="password" placeholder="输入密码" style="padding-right:40px">
        <button type="button" aria-label="显示密码" class="iconbtn" style="position:absolute;right:6px;top:6px;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;color:var(--muted-fg)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <button type="button" class="btn-primary">登录</button>
      <p style="margin:16px 0 0;text-align:center;font-size:13px;color:var(--muted-fg)">还没有账户？<a href="#" class="link">注册</a></p>

      <!-- dev-only: one quiet row at the bottom, a button that fills the seed admin; the password is never printed -->
      <div style="margin-top:20px;padding-top:14px;border-top:1px dashed var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px">
        <span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted-fg)"><span style="width:6px;height:6px;border-radius:3px;background:var(--amber)"></span>本地开发实例</span>
        <button type="button" class="chipbtn" style="height:28px;padding:0 10px;border:1px solid var(--border);font-size:12px;color:var(--fg)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--muted-fg)"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>以开发管理员登录</button>
      </div>
    </div>

    <!-- footer: language, environment, legal -->
    <div style="display:flex;align-items:center;justify-content:space-between;padding:0 4px;font-size:12px;color:var(--muted-fg)">
      <button type="button" class="chipbtn" style="height:28px;padding:0 8px;font-size:12px;color:var(--muted-fg);font-weight:400"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>简体中文<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      <span style="display:inline-flex;align-items:center;gap:10px"><a href="#" style="color:inherit">隐私</a><a href="#" style="color:inherit">条款</a><span style="font-family:var(--mono);font-size:11px;padding:2px 6px;border:1px solid var(--border);border-radius:999px">v18.0 · local</span></span>
    </div>
  </div>
</div>
</x-dc>

</body>
</html>
